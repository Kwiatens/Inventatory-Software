<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <title>Inventatory</title>
  <!--
    Inventatory mark "C1" (prompt + i) - master, v1.2
    Hand-specified geometry, no generated imagery.
    Grid: 1 cell = 100 units; canvas 6 x 9 cells.
    Colours: row-stepped blend from Interactive #58B9B0 (top) to FocusText #B9E7DD (bottom),
             the same palette roles and blend the terminal wordmark uses (AppSettings.h / OnboardingPage.cpp).
             Colour of a cell = blend(row / 8), row = cell top in cells.
  -->
  <g id="chevron">
    <rect x="0" y="350" width="100" height="100" fill="#82CDC4"/>
    <rect x="100" y="450" width="100" height="100" fill="#8FD3C9"/>
    <rect x="200" y="550" width="100" height="100" fill="#9BD9CF"/>
    <rect x="100" y="650" width="100" height="100" fill="#A7DED5"/>
    <rect x="0" y="750" width="100" height="100" fill="#B3E4DA"/>
  </g>
  <!-- rows 3-7 are 105 tall so each overlaps the next by 5 units: prevents hairline seams when rasterised -->
  <g id="stem">
    <rect x="400" y="300" width="200" height="105" fill="#7CCAC1"/>
    <rect x="400" y="400" width="200" height="105" fill="#89D0C7"/>
    <rect x="400" y="500" width="200" height="105" fill="#95D6CC"/>
    <rect x="400" y="600" width="200" height="105" fill="#A1DCD2"/>
    <rect x="400" y="700" width="200" height="105" fill="#ADE1D7"/>
    <rect x="400" y="800" width="200" height="100" fill="#B9E7DD"/>
  </g>
  <!-- the dot: four rack slots, full 100 x 100 cells like every other pixel
       (5-unit overlaps prevent hairline seams when rasterised) -->
  <g id="slots">
    <rect x="400" y="0" width="105" height="105" fill="#58B9B0"/>
    <rect x="500" y="0" width="100" height="105" fill="#58B9B0"/>
    <rect x="400" y="100" width="105" height="100" fill="#64BFB6"/>
    <rect x="500" y="100" width="100" height="100" fill="#64BFB6"/>
  </g>
</svg>
