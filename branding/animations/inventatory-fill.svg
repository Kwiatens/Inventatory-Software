<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <title>Inventatory - stock filling</title>
  <!-- Inventatory mark C1, animation "fill". Geometry and colours identical to inventatory-mark.svg v1.2.
       Pure SVG + CSS, loops forever, falls back to the static mark with prefers-reduced-motion. -->
  <style>
    rect{animation-duration:3.4s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes kfill-s0{0.000%{opacity:0.18}13.206%{opacity:0.18}13.235%{opacity:1}80.853%{opacity:1}80.882%{opacity:0.18}100.000%{opacity:0.18}}
    #fill-s0{animation-name:kfill-s0}
    @keyframes kfill-s1{0.000%{opacity:0.18}24.382%{opacity:0.18}24.412%{opacity:1}80.853%{opacity:1}80.882%{opacity:0.18}100.000%{opacity:0.18}}
    #fill-s1{animation-name:kfill-s1}
    @keyframes kfill-s2{0.000%{opacity:0.18}35.559%{opacity:0.18}35.588%{opacity:1}80.853%{opacity:1}80.882%{opacity:0.18}100.000%{opacity:0.18}}
    #fill-s2{animation-name:kfill-s2}
    @keyframes kfill-s3{0.000%{opacity:0.18}46.735%{opacity:0.18}46.765%{opacity:1}80.853%{opacity:1}80.882%{opacity:0.18}100.000%{opacity:0.18}}
    #fill-s3{animation-name:kfill-s3}
    @media (prefers-reduced-motion:reduce){rect{animation:none!important}}
  </style>
  <rect id="fill-c0" x="0" y="350" width="100" height="100" fill="#82CDC4"/>
  <rect id="fill-c1" x="100" y="450" width="100" height="100" fill="#8FD3C9"/>
  <rect id="fill-c2" x="200" y="550" width="100" height="100" fill="#9BD9CF"/>
  <rect id="fill-c3" x="100" y="650" width="100" height="100" fill="#A7DED5"/>
  <rect id="fill-c4" x="0" y="750" width="100" height="100" fill="#B3E4DA"/>
  <rect id="fill-r3" x="400" y="300" width="200" height="105" fill="#7CCAC1"/>
  <rect id="fill-r4" x="400" y="400" width="200" height="105" fill="#89D0C7"/>
  <rect id="fill-r5" x="400" y="500" width="200" height="105" fill="#95D6CC"/>
  <rect id="fill-r6" x="400" y="600" width="200" height="105" fill="#A1DCD2"/>
  <rect id="fill-r7" x="400" y="700" width="200" height="105" fill="#ADE1D7"/>
  <rect id="fill-r8" x="400" y="800" width="200" height="100" fill="#B9E7DD"/>
  <rect id="fill-s0" x="400" y="0" width="105" height="105" fill="#58B9B0"/>
  <rect id="fill-s1" x="500" y="0" width="100" height="105" fill="#58B9B0"/>
  <rect id="fill-s2" x="400" y="100" width="105" height="100" fill="#64BFB6"/>
  <rect id="fill-s3" x="500" y="100" width="100" height="100" fill="#64BFB6"/>
</svg>
