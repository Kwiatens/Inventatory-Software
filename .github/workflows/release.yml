name: Public beta release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.validate-tag.outputs.tag }}
      sha: ${{ steps.validate-tag.outputs.sha }}
    steps:
      - name: Validate release tag
        id: validate-tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '\Av\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?\z') {
            throw 'Release tags must use vX.Y.Z or vX.Y.Z-rc.N.'
          }
          $remote = "https://github.com/$env:GITHUB_REPOSITORY.git"
          $match = git ls-remote --exit-code --refs $remote "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $tag does not exist in the repository."
          }
          $sha = ($match -split '\s+')[0]
          if ($sha -notmatch '\A[0-9a-fA-F]{40}\z') {
            throw "Release tag $tag did not resolve to an immutable Git object."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    needs: validate
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Build and test x64 release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          cmake -S . -B build "-DINVENTATORY_VERSION=$version" `
            "-DINVENTATORY_RELEASE_REPOSITORY=$env:GITHUB_REPOSITORY" `
            "-DINVENTATORY_SCAN_FIRMWARE_REPOSITORY=$env:GITHUB_REPOSITORY_OWNER/Inventatory-Hardware"
          cmake --build build --config Release --target inventatory inventatory_background inventatory_tests inventatory_input_tests -- /m:1
          ctest --test-dir build -C Release --output-on-failure
      - name: Package release assets
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $packageRoot = Join-Path $PWD 'dist\Inventatory'
          $trackedLicense = Join-Path $PWD 'LICENSE'
          if (-not (Test-Path -LiteralPath $trackedLicense -PathType Leaf)) {
            throw 'Tracked GPL license text is missing from the checkout.'
          }
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath 'build\Release\inventatory.exe' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'build\Release\inventatory-background.exe' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'installer\Uninstall-Inventatory.cmd','installer\Uninstall-Inventatory.ps1' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'README.md','LICENSE.md','THIRD_PARTY_NOTICES.md' -Destination $packageRoot -Force
          # The package-level LICENSE is sourced from the tracked complete
          # GPL text so a clean release run never depends on stale dist output.
          Copy-Item -LiteralPath $trackedLicense -Destination (Join-Path $packageRoot 'LICENSE') -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot 'docs') | Out-Null
          Copy-Item -LiteralPath 'docs\public-beta.md' -Destination (Join-Path $packageRoot 'docs') -Force
          $requiredFiles = @(
            'inventatory.exe', 'inventatory-background.exe', 'LICENSE', 'LICENSE.md', 'README.md', 'THIRD_PARTY_NOTICES.md',
            'Uninstall-Inventatory.cmd', 'Uninstall-Inventatory.ps1', 'docs\public-beta.md'
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $packageRoot $requiredFile))) {
              throw "Release package is missing $requiredFile."
            }
          }
          $unexpectedFiles = @('data\iecd.sqlite3', 'data\iecd-manifest.json', 'MONOCYPHER-LICENSE.md', 'sqlite3.dll')
          foreach ($unexpectedFile in $unexpectedFiles) {
            if (Test-Path (Join-Path $packageRoot $unexpectedFile)) {
              throw "Release package unexpectedly contains $unexpectedFile."
            }
          }
          Compress-Archive -Path $packageRoot -DestinationPath 'dist\Inventatory-win-x64.zip' -Force
          Copy-Item installer\Install-Inventatory.cmd dist\
          $installer = Get-Content -Raw installer\Install-Inventatory.ps1
          $defaultRepositoryDeclaration = '[string]$Repository = ''__INVENTATORY_RELEASE_REPOSITORY__'''
          $publishedRepositoryDeclaration = "[string]`$Repository = '$env:GITHUB_REPOSITORY'"
          $installer = $installer.Replace($defaultRepositoryDeclaration, $publishedRepositoryDeclaration)
          if ($installer -notmatch [regex]::Escape($publishedRepositoryDeclaration) -or
              $installer -notmatch [regex]::Escape('__INVENTATORY_RELEASE_REPOSITORY__')) {
            throw 'The published installer repository binding is invalid.'
          }
          Set-Content -NoNewline -Path dist\Install-Inventatory.ps1 -Value $installer
          $updateAssets = @(
            @{ Path = 'dist\Inventatory-win-x64.zip'; Name = 'Inventatory-win-x64.zip' },
            @{ Path = 'dist\Install-Inventatory.ps1'; Name = 'Install-Inventatory.ps1' },
            @{ Path = 'dist\Install-Inventatory.cmd'; Name = 'Install-Inventatory.cmd' }
          )
          $hashLines = foreach ($asset in $updateAssets) {
            if (-not (Test-Path -LiteralPath $asset.Path -PathType Leaf)) {
              throw "Release update asset is missing $($asset.Name)."
            }
            $hash = (Get-FileHash -LiteralPath $asset.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          Set-Content -NoNewline -Path dist\SHA256SUMS.txt -Value ($hashLines -join "`n")

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventatory-windows-release-assets
          path: dist/*
          if-no-files-found: error

  build-linux:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config \
            libsecret-1-dev libcurl4-openssl-dev libssl-dev libglib2.0-dev \
            dbus-x11 gnome-keyring
      - name: Build and test Linux debug and release configurations
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          version="${RELEASE_TAG#v}"
          cmake -S . -B build-linux-debug -DCMAKE_BUILD_TYPE=Debug \
            -DINVENTATORY_VERSION="$version" \
            -DINVENTATORY_RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
            -DINVENTATORY_SCAN_FIRMWARE_REPOSITORY="$GITHUB_REPOSITORY_OWNER/Inventatory-Hardware"
          cmake --build build-linux-debug --parallel 2 --target inventatory inventatory_tests inventatory_input_tests
          cmake -S . -B build-linux-release -DCMAKE_BUILD_TYPE=Release \
            -DINVENTATORY_VERSION="$version" \
            -DINVENTATORY_RELEASE_REPOSITORY="$GITHUB_REPOSITORY" \
            -DINVENTATORY_SCAN_FIRMWARE_REPOSITORY="$GITHUB_REPOSITORY_OWNER/Inventatory-Hardware"
          cmake --build build-linux-release --parallel 2 --target inventatory inventatory_tests inventatory_input_tests
          printf '%s' 'ci-keyring-password' | dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --unlock --components=secrets)"
            ctest --test-dir build-linux-debug --output-on-failure
            ctest --test-dir build-linux-release --output-on-failure
          '
      - name: Package Linux release assets
        run: |
          set -euo pipefail
          package_root="$PWD/dist/Inventatory"
          mkdir -p "$package_root/docs"
          install -m 755 build-linux-release/inventatory "$package_root/inventatory"
          install -m 644 LICENSE LICENSE.md README.md THIRD_PARTY_NOTICES.md "$package_root/"
          install -m 644 docs/linux-support.md "$package_root/docs/linux-support.md"
          archive_path="$PWD/dist/Inventatory-linux-x64.tar.gz"
          tar -C "$package_root" -czf "$archive_path" \
            inventatory LICENSE LICENSE.md README.md THIRD_PARTY_NOTICES.md docs/linux-support.md
          install -m 755 installer/Install-Inventatory.sh dist/Install-Inventatory.sh
          (
            cd dist
            sha256sum Inventatory-linux-x64.tar.gz Install-Inventatory.sh > SHA256SUMS-linux.txt
          )
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventatory-linux-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, build, build-linux]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventatory-windows-release-assets
          path: dist/windows
      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventatory-linux-release-assets
          path: dist/linux
      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          $releaseArguments = @(
            'release', 'create', $tag,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "Inventatory $tag",
            '--generate-notes'
          )
          if ($tag -match '-') { $releaseArguments += '--prerelease' }
          $releaseArguments += @(
            'dist\windows\Inventatory-win-x64.zip',
            'dist\windows\SHA256SUMS.txt',
            'dist\windows\Install-Inventatory.cmd',
            'dist\windows\Install-Inventatory.ps1',
            'dist\linux\Inventatory-linux-x64.tar.gz',
            'dist\linux\SHA256SUMS-linux.txt',
            'dist\linux\Install-Inventatory.sh'
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; published assets are immutable. Use a new version tag."
          }
          gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
