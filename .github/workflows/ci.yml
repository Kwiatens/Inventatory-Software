name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Built and tested in AlmaLinux 9 (glibc 2.34, GCC 11), so the release binary runs there and on newer
  # distributions. Dependencies are installed before checkout because the container has no git.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16
      # gnome-keyring-daemon carries the cap_ipc_lock file capability and cannot start without it.
      options: --cap-add IPC_LOCK
    steps:
      - name: Install Linux build and runtime dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ make cmake pkgconf-pkg-config binutils git tar \
            libsecret-devel libcurl-devel openssl-devel glib2-devel \
            dbus-daemon gnome-keyring glibc-langpack-pl glibc-langpack-de
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux debug and release configurations
        run: |
          cmake -S . -B build-linux-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-linux-debug --parallel 2 --target inventatory inventatory_tests inventatory_input_tests
          cmake -S . -B build-linux-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux-release --parallel 2 --target inventatory inventatory_tests inventatory_input_tests
      - name: Check the release binary's Linux compatibility floor
        run: bash tools/check-linux-abi.sh build-linux-release/inventatory
      - name: Smoke test the Linux release binary
        run: |
          # --version is answered before any terminal setup, so this runs headless. It catches a missing
          # shared library or a startup crash in the binary that would be shipped.
          build-linux-release/inventatory --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          if ldd build-linux-release/inventatory | grep -q 'not found'; then
            ldd build-linux-release/inventatory
            exit 1
          fi
      - name: Test Linux debug and release configurations
        env:
          INVENTATORY_REQUIRE_LOCALE_TESTS: "1"
          INVENTATORY_REQUIRE_KEYRING_TESTS: "1"
        run: |
          mkdir -p "$HOME/.cache" "$HOME/.local/share/keyrings"
          printf '%s' 'ci-keyring-password' | dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --unlock --components=secrets)"
            ctest --test-dir build-linux-debug --output-on-failure
            ctest --test-dir build-linux-release --output-on-failure
          '
      - name: Test Linux release installer
        run: bash installer/Test-InventatoryLinuxInstall.sh
      - name: Package the release binary for the runtime checks
        run: tar -C build-linux-release -czf inventatory-linux-binary.tar.gz inventatory
      - name: Upload the release binary for the runtime checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventatory-linux-binary
          path: inventatory-linux-binary.tar.gz
          if-no-files-found: error

  # The release binary built above must start, install and draw its interface on the distributions the release
  # claims to support. AlmaLinux 9 is a RHEL 9 rebuild and stands in for RHEL 9.
  linux-runtime:
    needs: linux
    name: Runtime on ${{ matrix.distribution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 22.04
            family: debian
            image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
          - distribution: Debian 12
            family: debian
            image: debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
          - distribution: AlmaLinux 9
            family: rhel
            image: almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install runtime libraries (Debian family)
        if: matrix.family == 'debian'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            libsecret-1-0 libcurl4 libssl3 libglib2.0-0 libstdc++6 libgcc-s1 python3 git ca-certificates
      - name: Install runtime libraries (RHEL family)
        if: matrix.family == 'rhel'
        run: |
          # The base image ships libcurl-minimal, which provides libcurl.so.4 and conflicts with libcurl.
          dnf install -y --setopt=install_weak_deps=False \
            libsecret libcurl-minimal openssl-libs glib2 libstdc++ python3 git tar
      # Checkout runs first: it cleans untracked files by default, which would remove a download made before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventatory-linux-binary
          path: dist
      - name: Check the release binary on this distribution
        run: |
          tar -xzf dist/inventatory-linux-binary.tar.gz -C dist
          bash tools/check-linux-runtime.sh dist/inventatory

  # A second compiler: Clang finds portability and warning problems that GCC does not, and runs the same
  # tests.
  linux-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake pkg-config \
            libsecret-1-dev libcurl4-openssl-dev libssl-dev libglib2.0-dev \
            dbus-x11 gnome-keyring locales
          sudo locale-gen pl_PL.UTF-8 de_DE.UTF-8
      - name: Build with Clang
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-linux-clang -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-linux-clang --parallel 2 --target inventatory inventatory_tests inventatory_input_tests
      - name: Test the Clang build
        env:
          INVENTATORY_REQUIRE_LOCALE_TESTS: "1"
          INVENTATORY_REQUIRE_KEYRING_TESTS: "1"
        run: |
          printf '%s' 'ci-keyring-password' | dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --unlock --components=secrets)"
            ctest --test-dir build-linux-clang --output-on-failure
          '

  # AddressSanitizer and UndefinedBehaviorSanitizer over the core tests: the scanner HTTP service,
  # fork-based process tests, SQLite handles and manual socket code are where memory errors would hide.
  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config \
            libsecret-1-dev libcurl4-openssl-dev libssl-dev libglib2.0-dev \
            dbus-x11 gnome-keyring locales
          sudo locale-gen pl_PL.UTF-8 de_DE.UTF-8
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -S . -B build-linux-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags"
          cmake --build build-linux-sanitize --parallel 2 --target inventatory_tests inventatory_input_tests
      - name: Test the sanitizer build
        env:
          INVENTATORY_REQUIRE_LOCALE_TESTS: "1"
          INVENTATORY_REQUIRE_KEYRING_TESTS: "1"
        run: |
          printf '%s' 'ci-keyring-password' | dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --unlock --components=secrets)"
            ctest --test-dir build-linux-sanitize --output-on-failure
          '

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test x64 release
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target inventatory inventatory_background inventatory_tests inventatory_input_tests -- /m:1
          ctest --test-dir build -C Release --output-on-failure

  # Console output never names a credential. git grep exits 1 when nothing matches; only that status passes.
  secret-logging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject credentials in console output
        run: |
          status=0
          git grep -n -E -e '(std::(cout|cerr|clog)|printf|fprintf|OutputDebugString|syslog)[^;]*(password|token|secret|credential)' -- src tests tools || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::A console output call names a credential"
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::git grep failed with exit $status"
            exit "$status"
          fi
